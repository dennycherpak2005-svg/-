<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontakt aufnehmen</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✉️</text></svg>" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
      min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #0f172a;
    }
    .wrap { width: 100%; max-width: 520px; }
    .card {
      background: #fff; border-radius: 22px; padding: 36px;
      box-shadow: 0 25px 60px -15px rgba(0,0,0,.4);
    }
    .head { text-align: center; margin-bottom: 26px; }
    .head .emoji { font-size: 44px; }
    .head h1 { font-size: 26px; font-weight: 800; margin-top: 8px; }
    .head p { color: #64748b; margin-top: 6px; font-size: 15px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 12px 14px; border: 1px solid #e2e8f0; border-radius: 12px;
      font-size: 15px; font-family: inherit; transition: border .15s, box-shadow .15s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px #eef2ff;
    }
    .field textarea { resize: vertical; min-height: 96px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .submit {
      width: 100%; padding: 14px; border: none; border-radius: 12px; margin-top: 8px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff;
      font-size: 16px; font-weight: 700; cursor: pointer; transition: transform .08s, filter .15s;
    }
    .submit:hover { filter: brightness(1.07); }
    .submit:active { transform: scale(.98); }
    .hint { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 16px; }
    .hint a { color: #4f46e5; text-decoration: none; }
    /* Erfolg */
    .success { text-align: center; padding: 20px 0; display: none; }
    .success.show { display: block; animation: pop .3s ease; }
    .success .check {
      width: 76px; height: 76px; border-radius: 50%; background: #dcfce7; color: #16a34a;
      display: grid; place-items: center; font-size: 40px; margin: 0 auto 18px;
    }
    .success h2 { font-size: 22px; font-weight: 800; }
    .success p { color: #64748b; margin-top: 8px; }
    .success button {
      margin-top: 22px; padding: 11px 22px; border: 1px solid #e2e8f0; border-radius: 12px;
      background: #fff; font-weight: 600; cursor: pointer; font-size: 14px;
    }
    @keyframes pop { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
    @media (max-width: 480px) { .row2 { grid-template-columns: 1fr; } .card { padding: 26px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <!-- Formular -->
      <form id="lead-form">
        <div class="head">
          <div class="emoji">✉️</div>
          <h1>Lass uns sprechen</h1>
          <p>Hinterlasse deine Daten – wir melden uns schnellstmöglich bei dir.</p>
        </div>
        <div class="row2">
          <div class="field"><label>Name *</label><input name="name" required placeholder="Max Mustermann" /></div>
          <div class="field"><label>Firma</label><input name="company" placeholder="Muster GmbH" /></div>
        </div>
        <div class="row2">
          <div class="field"><label>E-Mail *</label><input name="email" type="email" required placeholder="max@firma.de" /></div>
          <div class="field"><label>Telefon</label><input name="phone" placeholder="+49 …" /></div>
        </div>
        <div class="row2">
          <div class="field">
            <label>Wie hast du von uns gehört?</label>
            <select name="source">
              <option>Webformular</option>
              <option>Google</option>
              <option>LinkedIn</option>
              <option>Empfehlung</option>
              <option>Messe</option>
              <option>Sonstiges</option>
            </select>
          </div>
          <div class="field"><label>Budget (optional)</label><input name="budget" placeholder="z. B. 5.000 €" /></div>
        </div>
        <div class="field"><label>Deine Nachricht</label><textarea name="message" placeholder="Worum geht es?"></textarea></div>
        <button class="submit" type="submit">Anfrage senden →</button>
        <div class="hint">🔒 Deine Daten werden vertraulich behandelt. · <a href="crm-demo.html">Zum CRM-Dashboard</a> · <a href="index.html">Zur Website</a></div>
      </form>

      <!-- Erfolgsmeldung -->
      <div class="success" id="success">
        <div class="check">✓</div>
        <h2>Vielen Dank!</h2>
        <p>Deine Anfrage ist bei uns eingegangen. Wir melden uns in Kürze.</p>
        <button id="again">Weitere Anfrage senden</button>
      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script>
    const form = document.getElementById("lead-form");
    const success = document.getElementById("success");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const lead = Object.fromEntries(fd.entries());
      Store.addLead({ ...lead, stage: "neu", source: lead.source || "Webformular" });
      form.style.display = "none";
      success.classList.add("show");
      form.reset();
    });

    document.getElementById("again").addEventListener("click", () => {
      success.classList.remove("show");
      form.style.display = "block";
    });
  </script>
</body>
</html>
